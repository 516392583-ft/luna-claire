<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-burgundy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <linearGradient id="box-burgundy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#722F37"/>
      <stop offset="100%" stop-color="#4A1C22"/>
    </linearGradient>
    <linearGradient id="boxTop-burgundy" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#722F37"/>
      <stop offset="100%" stop-color="#8B3A44"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4B886"/>
      <stop offset="50%" stop-color="#B8945C"/>
      <stop offset="100%" stop-color="#D4B886"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#722F37" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#722F37" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-burgundy)"/>

  <!-- Background subtle pattern -->
  <g opacity="0.03">
    <line x1="0" y1="150" x2="800" y2="150" stroke="#722F37" stroke-width="0.3"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#722F37" stroke-width="0.3"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke="#722F37" stroke-width="0.3"/>
  </g>

  <!-- Title -->
  <text x="400" y="65" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="26" fill="#722F37" font-weight="500" letter-spacing="4">产品实物包装概念</text>
  <text x="400" y="90" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7A7A7A" font-weight="300" letter-spacing="6">PRODUCT PACKAGING CONCEPT</text>
  <line x1="350" y1="105" x2="450" y2="105" stroke="#B8945C" stroke-opacity="0.3" stroke-width="0.5"/>

  <!-- Main box - perspective front face -->
  <g filter="url(#shadow)">
    <!-- Front face -->
    <rect x="230" y="200" width="340" height="260" rx="2" fill="url(#box-burgundy)"/>
    <!-- Top face -->
    <polygon points="230,200 290,150 630,150 570,200" fill="url(#boxTop-burgundy)"/>
    <!-- Right face -->
    <polygon points="570,200 630,150 630,410 570,460" fill="#4A1C22"/>
  </g>

  <!-- Box decorative elements - front panel -->
  <!-- Gold decorative line on box -->
  <line x1="280" y1="240" x2="520" y2="240" stroke="url(#goldBar)" stroke-opacity="0.15" stroke-width="0.5"/>

  <!-- Brand on box -->
  <text x="400" y="310" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="42" fill="#F5F0E8" font-weight="400" letter-spacing="5">Luna</text>
  <text x="400" y="350" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="42" fill="#D4B886" font-style="italic" font-weight="400" letter-spacing="5">Claire</text>

  <!-- Center gold line -->
  <line x1="360" y1="368" x2="440" y2="368" stroke="#D4B886" stroke-opacity="0.25" stroke-width="0.5"/>

  <!-- Slogan -->
  <text x="400" y="395" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" fill="#D4B886" fill-opacity="0.3" font-style="italic" letter-spacing="4">书写立心 · 优雅自成</text>

  <!-- Small foil emblem suggestion -->
  <g transform="translate(400, 428)">
    <rect x="-18" y="-8" width="36" height="16" rx="1" fill="none" stroke="#B8945C" stroke-opacity="0.15" stroke-width="0.4"/>
    <text x="0" y="2" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6" fill="#B8945C" fill-opacity="0.15" letter-spacing="3">FOIL EMBOSS</text>
  </g>

  <!-- Bottom decorative line -->
  <line x1="280" y1="440" x2="520" y2="440" stroke="url(#goldBar)" stroke-opacity="0.1" stroke-width="0.3"/>

  <!-- Side notes -->
  <g transform="translate(580, 240)" opacity="0.5">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" fill="#7A7A7A" letter-spacing="2">天 地 盖 盒 型</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-size="8" fill="#7A7A7A" font-weight="300">特 种 纸 + 触 感 膜</text>
  </g>

  <!-- Material callouts -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="90" height="70" rx="1" fill="white" stroke="#E8E0D4" stroke-width="0.4" filter="url(#softShadow)"/>
    <text x="45" y="22" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="11" fill="#722F37" font-weight="500">烫 金</text>
    <text x="45" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#7A7A7A" font-weight="300">Gold Foil</text>
    <line x1="15" y1="48" x2="75" y2="48" stroke="#B8945C" stroke-opacity="0.2" stroke-width="0.3"/>
    <text x="45" y="62" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" fill="#7A7A7A" font-weight="300">小面积精致点缀</text>
  </g>

  <g transform="translate(100, 340)">
    <rect x="0" y="0" width="90" height="70" rx="1" fill="white" stroke="#E8E0D4" stroke-width="0.4" filter="url(#softShadow)"/>
    <text x="45" y="22" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="11" fill="#722F37" font-weight="500">触 感 膜</text>
    <text x="45" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#7A7A7A" font-weight="300">Soft Touch</text>
    <line x1="15" y1="48" x2="75" y2="48" stroke="#B8945C" stroke-opacity="0.2" stroke-width="0.3"/>
    <text x="45" y="62" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" fill="#7A7A7A" font-weight="300">温润亲肤手感</text>
  </g>

  <!-- Bottom accessory - brand card mockup -->
  <g transform="translate(400, 520)" filter="url(#softShadow)">
    <rect x="-120" y="-25" width="240" height="50" rx="1" fill="white" stroke="#E8E0D4" stroke-width="0.3"/>
    <text x="0" y="-4" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="11" fill="#722F37" font-weight="500">品牌故事卡 · Brand Story Card</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#7A7A7A" font-weight="300">特种纸印刷 · 烫金 Logo · 附于盒内</text>
  </g>
</svg>
